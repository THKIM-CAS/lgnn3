[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "light-dlgn"
version = "0.1.0"
description = "Clean PyTorch reference implementation of fully-connected Light DLGNs."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "nvidia-cublas-cu12==12.1.3.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cuda-cupti-cu12==12.1.105; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cuda-nvrtc-cu12==12.1.105; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cuda-runtime-cu12==12.1.105; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cudnn-cu12==9.1.0.70; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cufft-cu12==11.0.2.54; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-curand-cu12==10.3.2.106; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cusolver-cu12==11.4.5.107; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cusparse-cu12==12.1.0.106; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-nccl-cu12==2.21.5; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-nvjitlink-cu12==12.9.86; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-nvtx-cu12==12.1.105; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "tqdm>=4.66",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }
torchvision = { index = "pytorch-cu121", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
